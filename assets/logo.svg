<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300">
  <title>Friendslop Truck</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#87CEEB"/>
      <stop offset="1" stop-color="#BFE6F5"/>
    </linearGradient>
    <clipPath id="card"><rect width="960" height="300" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="960" height="300" fill="url(#sky)"/>
    <!-- low-poly hills -->
    <polygon points="0,210 120,150 230,195 360,135 470,190 600,140 720,185 840,130 960,175 960,300 0,300" fill="#7CB87A"/>
    <polygon points="0,210 120,150 150,200" fill="#6AA868"/>
    <polygon points="360,135 470,190 400,200" fill="#6AA868"/>
    <polygon points="840,130 960,175 880,190" fill="#6AA868"/>
    <!-- trees -->
    <g>
      <polygon points="855,190 880,120 905,190" fill="#2D6A2D"/><polygon points="880,120 905,190 885,190" fill="#245824"/>
      <rect x="876" y="190" width="8" height="14" fill="#8B5E3C"/>
      <polygon points="905,200 925,145 945,200" fill="#2D6A2D"/><polygon points="925,145 945,200 928,200" fill="#245824"/>
      <rect x="921" y="200" width="7" height="12" fill="#8B5E3C"/>
    </g>
    <!-- road -->
    <rect x="0" y="232" width="960" height="68" fill="#555566"/>
    <rect x="0" y="232" width="960" height="5" fill="#FFD700"/>
    <rect x="0" y="295" width="960" height="5" fill="#FFD700"/>
    <g fill="#FFFFFF">
      <rect x="20" y="263" width="60" height="6"/><rect x="140" y="263" width="60" height="6"/>
      <rect x="380" y="263" width="60" height="6"/><rect x="500" y="263" width="60" height="6"/>
      <rect x="620" y="263" width="60" height="6"/><rect x="740" y="263" width="60" height="6"/>
      <rect x="860" y="263" width="60" height="6"/>
    </g>
    <!-- truck -->
    <g transform="translate(36,78)">
      <ellipse cx="150" cy="178" rx="160" ry="10" fill="#000" opacity=".18"/>
      <!-- trailer -->
      <polygon points="0,30 14,16 214,16 200,30" fill="#FF8A5C"/>
      <polygon points="200,30 214,16 214,136 200,150" fill="#CC4422"/>
      <rect x="0" y="30" width="200" height="120" fill="#FF6B35"/>
      <rect x="0" y="136" width="200" height="14" fill="#CC4422"/>
      <!-- cargo boxes peeking -->
      <rect x="22" y="48" width="34" height="34" fill="#F4C430"/><rect x="22" y="60" width="34" height="6" fill="#8B5E3C"/>
      <!-- cabin -->
      <polygon points="214,62 226,50 272,50 290,80 290,150 214,150" fill="#CC4422"/>
      <polygon points="226,50 272,50 268,56 230,56" fill="#E0573A"/>
      <polygon points="232,62 268,62 284,90 232,90" fill="#1A1A2E"/>
      <rect x="276" y="122" width="16" height="10" fill="#FFD700"/>
      <rect x="214" y="146" width="80" height="10" fill="#222222"/>
      <rect x="236" y="24" width="10" height="30" fill="#222222"/>
      <!-- wheels -->
      <g fill="#222222">
        <circle cx="40" cy="160" r="20"/><circle cx="92" cy="160" r="20"/><circle cx="252" cy="160" r="20"/>
      </g>
      <g fill="#555566">
        <rect x="32" y="152" width="16" height="16"/><rect x="84" y="152" width="16" height="16"/><rect x="244" y="152" width="16" height="16"/>
      </g>
    </g>
    <!-- title -->
    <g font-family="'Trebuchet MS','Arial Black',Verdana,sans-serif" font-weight="900" text-anchor="start">
      <text x="372" y="110" font-size="76" fill="#1A1A2E" opacity=".35">FRIENDSLOP</text>
      <text x="366" y="104" font-size="76" fill="#FF6B35" stroke="#1A1A2E" stroke-width="3" paint-order="stroke">FRIENDSLOP</text>
      <text x="372" y="192" font-size="76" fill="#1A1A2E" opacity=".35">TRUCK</text>
      <text x="366" y="186" font-size="76" fill="#FFD700" stroke="#1A1A2E" stroke-width="3" paint-order="stroke">TRUCK</text>
      <text x="370" y="222" font-size="22" font-weight="700" fill="#1A1A2E" letter-spacing="1.5">CO-OP · ŠOFÉR + STRELEC · LAN / HAMACHI</text>
    </g>
    <!-- crosshair -->
    <g transform="translate(745,150)" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity=".95">
      <circle r="22" stroke="#1A1A2E" stroke-width="9"/>
      <circle r="22"/>
      <line x1="0" y1="-38" x2="0" y2="-28" stroke="#FF4444"/><line x1="0" y1="28" x2="0" y2="38" stroke="#FF4444"/>
      <line x1="-38" y1="0" x2="-28" y2="0" stroke="#FF4444"/><line x1="28" y1="0" x2="38" y2="0" stroke="#FF4444"/>
    </g>
  </g>
</svg>
