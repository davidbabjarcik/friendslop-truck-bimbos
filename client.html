<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Friendslop Truck — Multiplayer</title>
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<style>
  :root { --ui:#1A1A2E; --accent:#FF6B35; --gold:#FFD700; --p1:#FF6B35; --p2:#4FC3F7; --threat:#FF4444; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:#87CEEB; color:#fff;
    font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; user-select:none; }
  canvas { display:block; }
  .panel { background:rgba(26,26,46,.86); border-radius:12px; padding:10px 14px; box-shadow:0 4px 0 rgba(0,0,0,.25); }
  .hud { display:none; }
  .hud.show { display:block; }
  #hudLeft { position:fixed; top:14px; left:14px; min-width:240px; z-index:5; font-size:15px; line-height:1.45; }
  #hudRight { position:fixed; top:14px; right:14px; z-index:5; text-align:right; font-size:15px; line-height:1.5; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:5; font-size:14px; white-space:nowrap; }
  #progress { position:fixed; top:20px; left:50%; transform:translateX(-50%); width:min(420px,36vw); height:14px;
    background:rgba(26,26,46,.86); border-radius:8px; z-index:5; display:none; }
  #progressFill { height:100%; width:0; background:var(--gold); border-radius:8px; }
  #progressTruck { position:absolute; top:-9px; left:0; font-size:22px; transform:translateX(-50%) scaleX(-1); }
  #progressFlag { position:absolute; top:-9px; right:-14px; font-size:20px; }
  .bar { height:10px; background:rgba(255,255,255,.15); border-radius:6px; overflow:hidden; margin:3px 0 7px; }
  .bar > i { display:block; height:100%; border-radius:6px; }
  .big { font-size:26px; font-weight:800; }
  .muted { opacity:.72; font-size:13px; }
  .role { font-weight:800; font-size:17px; }
  #crosshair { position:fixed; left:0; top:0; width:0; height:0; z-index:8; pointer-events:none; display:none; }
  #crosshair svg { position:absolute; left:-24px; top:-24px; width:48px; height:48px; overflow:visible; }
  #crosshair.hit svg * { stroke:var(--threat); }
  #cdbar { position:absolute; left:-24px; top:30px; width:48px; height:6px; background:rgba(0,0,0,.5); border-radius:3px; overflow:hidden; }
  #cdfill { height:100%; width:100%; background:#fff; }
  #trails { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:7; }
  #trails line { transition:opacity .2s linear; }
  #flash { position:fixed; inset:0; background:var(--threat); opacity:0; pointer-events:none; z-index:6; transition:opacity .35s; }
  #banner { position:fixed; top:30%; left:50%; transform:translate(-50%,-50%) scale(.8); font-size:46px; font-weight:900;
    text-shadow:0 4px 0 #1A1A2E, 0 0 24px rgba(0,0,0,.35); opacity:0; transition:all .25s; z-index:9; pointer-events:none; white-space:nowrap; }
  #banner.show { opacity:1; transform:translate(-50%,-50%) scale(1); }
  #toasts { position:fixed; top:74px; left:50%; transform:translateX(-50%); z-index:9; display:flex; flex-direction:column;
    gap:6px; align-items:center; pointer-events:none; }
  .toast { background:rgba(26,26,46,.92); padding:8px 16px; border-radius:20px; font-size:15px; animation:tin .2s; }
  @keyframes tin { from { opacity:0; transform:translateY(-8px); } }
  .overlay { position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; gap:12px;
    background:rgba(26,26,46,.88); z-index:20; text-align:center; padding:20px; }
  .overlay.show { display:flex; }
  .overlay h1 { font-size:58px; margin:0; color:var(--accent); letter-spacing:2px; text-shadow:0 5px 0 #000; line-height:1; }
  .overlay h2 { font-size:34px; margin:0; }
  .overlay p { margin:0; max-width:640px; }
  button.big { background:var(--accent); color:#fff; border:0; border-radius:12px; padding:14px 28px; font:inherit; font-size:20px;
    font-weight:800; cursor:pointer; box-shadow:0 5px 0 #CC4422; min-height:48px; }
  button.big:active { transform:translateY(3px); box-shadow:0 2px 0 #CC4422; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #ipInput { font:inherit; font-size:20px; padding:12px 14px; border-radius:12px; border:3px solid var(--accent); background:#fff;
    color:#1A1A2E; width:260px; text-align:center; }
  .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
  .dots::after { content:''; animation:dots 1.4s steps(4) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
  #shopCards { display:grid; grid-template-columns:repeat(4, minmax(170px, 215px)); gap:14px; margin:6px 0 10px; }
  @media (max-width: 960px) { #shopCards { grid-template-columns:repeat(2, minmax(160px, 215px)); } }
  .card { background:#24243e; border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:7px; text-align:left; }
  .card .icon { font-size:34px; line-height:1; }
  .card b { font-size:18px; }
  .pips { letter-spacing:4px; color:var(--gold); font-size:18px; }
  .card button { margin-top:auto; background:var(--gold); color:#1A1A2E; border:0; border-radius:10px; padding:10px; font:inherit;
    font-weight:800; cursor:pointer; min-height:44px; }
  .cash { font-size:32px; font-weight:900; color:var(--gold); }
  .menu-btns { display:flex; flex-direction:column; gap:12px; width:min(280px, 90vw); }
  button.big.alt { background:#24243e; box-shadow:0 5px 0 #0d0d1a; }
  button.big.alt:active { box-shadow:0 2px 0 #0d0d1a; }
  button.link { background:none; border:0; color:#fff; opacity:.75; font:inherit; font-size:15px; cursor:pointer; min-height:44px; }
  button.link:hover { opacity:1; }
  .overlay p.credits { position:absolute; bottom:16px; left:0; right:0; margin:0 auto; }
  #ovInfo { z-index:30; }
  .info { max-width:640px; width:100%; max-height:72vh; overflow:auto; text-align:left; background:#24243e; border-radius:14px; padding:18px 22px; line-height:1.5; }
  .info h3 { margin:0 0 8px; color:var(--accent); font-size:24px; }
  .info h4 { margin:14px 0 4px; color:var(--gold); }
  .info table { border-collapse:collapse; width:100%; font-size:14px; }
  .info td, .info th { padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.1); vertical-align:top; text-align:left; }
  .info ul { margin:4px 0; padding-left:20px; }
  #btnMenu { position:fixed; right:14px; bottom:14px; z-index:5; width:48px; height:48px; border:0; border-radius:12px;
    background:rgba(26,26,46,.86); color:#fff; font-size:22px; cursor:pointer; }
  #btnMenu.hud.show { display:block; }
  .tag { display:inline-block; padding:1px 9px; border-radius:10px; font-weight:800; color:#1A1A2E; font-size:13px; }
</style>
</head>
<body>

<div id="hudRight" class="panel hud"></div>
<div id="hint" class="panel hud"></div>
<div id="progress"><div id="progressFill"></div><div id="progressTruck">🚚</div><div id="progressFlag">🏁</div></div>
<svg id="trails"></svg>
<div id="crosshair">
  <svg viewBox="0 0 48 48">
    <circle cx="24" cy="24" r="15" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="24" y1="2" x2="24" y2="14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="34" x2="24" y2="46" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="2" y1="24" x2="14" y2="24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="34" y1="24" x2="46" y2="24" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

</div>

<div id="banner"></div>

<div id="ovConnect" class="overlay show">
  <h1>FRIENDSLOP<br>TRUCK</h1>
  <p class="muted">co-op · šofér + strelec · LAN / Hamachi</p>
  <div id="viewMain" class="menu-btns" style="margin-top:14px">
    <button class="big" data-view="play">▶ Hrať</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ═══════════════════════════════════════════════════════════════
   a. KONŠTANTY
   ═══════════════════════════════════════════════════════════════ */
const HOST_IP = 'localhost';      // ← FILL: Hamachi IP hostu (25.x.x.x). Dá sa zadať aj na úvodnej obrazovke alebo ?host=25.x.x.x
const PORT = 3000;
const RECONNECT_MS = 2000;
const RECONNECT_MAX = 5;

const PAL = {
  SKY:'#87CEEB', GROUND:'#7CB87A', ROAD:'#555566', STRIPE:'#FFFFFF', EDGE:'#FFD700',
  TRUCK:'#FF6B35', CABIN:'#CC4422', WHEEL:'#222222', CARGO:'#F4C430', SHELF:'#C8A87A',
  BUILDING:'#D4A96A', TREE:'#2D6A2D', TRUNK:'#8B5E3C', THREAT:'#FF4444', ANIMAL:'#8B5E3C',
  UI_BG:'#1A1A2E', ACCENT:'#FF6B35', GOLD:'#FFD700', PLAYER1:'#FF6B35', PLAYER2:'#4FC3F7',
  SHOT_TRAIL:'#FFFFFF', HIT_FLASH:'#FF4444',
};
const PLAYER_COLORS = { 1: PAL.PLAYER1, 2: PAL.PLAYER2 };
const ROLE_NAME = { driver: 'Šofér 🚚', gunner: 'Strelec 🎯' };
const ROLE_PLAIN = { 1: 'Šofér', 2: 'Strelec' };

const TRIP_DIST = 600;
const GUN_CAM = { fov: 60, y: 10, back: 12, lookY: 1, lookAhead: 25 };   // MUSÍ sedieť so server.js
const DRIVER_CAM = { y: 5.5, back: 13, lookY: 1.2, lookAhead: 14 };
const UPGRADE_COST = [100, 200, 350];
const MAX_LEVEL = 3;
const UPGRADES = [
  { key: 'engine',    name: 'Motor',  icon: '⚙️', desc: (l) => `Rýchlosť ${14 + l * 4} u/s, spotreba −${l * 10} %` },
  { key: 'armor',     name: 'Pancier', icon: '🛡️', desc: (l) => `Poškodenie nákladu −${l * 20} %` },
  { key: 'horn',      name: 'Trúba',  icon: '📯', desc: (l) => `Dosah ${18 + l * 6}, stun ${2 + l * 0.5} s, reload strelca ${(0.4 - l * 0.08).toFixed(2)} s` },
  { key: 'warehouse', name: 'Sklad',  icon: '📦', desc: (l) => `${8 + l * 2} škatúľ na jazdu (viac peňazí)` },
];
let localPlayer = { x: 0, z: 0 };
let localTruckX = 0;
const ROAD_TILE = 20;
const ROAD_TILES = 16;
const ROAD_W = 9;
const TREE_COUNT = 64;
const HOUSE_COUNT = 10;
const SCENERY_SPAN = 280;
const AIM_SENS = 1.0;
const LERP = 14;

const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);

/* ═══════════════════════════════════════════════════════════════
   b. WEBSOCKET SETUP + MESSAGE HANDLER
   ═══════════════════════════════════════════════════════════════ */
const qsHost = new URLSearchParams(location.search).get('host');
let ws = null;
let hostIp = '';
let myId = 0;
let myRole = '';
let reconnectTries = 0;
let reconnectTimer = 0;
let gotFull = false;
let userLeft = false;          // hráč sa odpojil cez menu → bez reconnectu
let S = null;                 // posledný tick zo servera
let lastTickAt = 0;
function connect(host) {
  clearTimeout(reconnectTimer);
  hostIp = host;
  gotFull = false;
  if (!reconnectTries) setConnMsg(`Pripájam sa na ${host}:${PORT}…`);
  let sock;
  try { sock = new WebSocket(`ws://${host}:${PORT}`); }
  catch (e) { setConnMsg('Neplatná adresa.'); return; }
  ws = sock;
  sock.onopen = () => { reconnectTries = 0; lastSentInput = ''; };
  sock.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch { return; }
    handleMsg(m);
  };
  sock.onerror = () => {};
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null;
    myId = 0;
    if (gotFull) return;
    if (userLeft) {
      userLeft = false;
      S = null;
      setMode('warehouse');
      clearThreats();
      for (const ov of document.querySelectorAll('.overlay.show')) ov.classList.remove('show');
      $('ovConnect').classList.add('show');
      showView('main');
      setConnMsg('');
      return;
    }
    if (reconnectTries >= RECONNECT_MAX) {
      reconnectTries = 0;
      showConnect('❌ Nepodarilo sa pripojiť. Beží server.js? Je IP správna a ste v rovnakej Hamachi sieti?');
      return;
    }
    reconnectTries++;
    showConnect(`Spojenie nie je — pokus ${reconnectTries}/${RECONNECT_MAX} o 2 s…`);
    reconnectTimer = setTimeout(() => { if (!ws) connect(hostIp); }, RECONNECT_MS);
  };
}

function send(obj) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
}

function handleMsg(m) {
  if (m.type === 'init') {
    myId = m.id;
    myRole = m.role;
    try { localStorage.setItem('fst-host', hostIp); } catch { /* ignore */ }
    $('ovConnect').classList.remove('show');
    setConnMsg('');
    toast(myRole === 'driver' ? 'Pripojený ako Šofér 🚚' : 'Pripojený ako Strelec 🎯');
    shopKey = '';
  } else if (m.type === 'full') {
    gotFull = true;
    showConnect('Server je plný (2/2 hráči).');
  } else if (m.type === 'tick') {
    onTick(m);
  }
}

function onTick(m) {
  const prev = S;
  S = m;
  lastTickAt = performance.now();
  if (!prev || prev.phase !== m.phase) onPhaseChange(prev ? prev.phase : null, m.phase);
  for (const id of m.shotHits) onShotHit(id);
  for (const ev of m.events) handleEvent(ev);
  syncPlayers();
  syncBoxes();
  syncThreats();
  updateOverlays();
}

function handleEvent(ev) {
  switch (ev.t) {
    case 'join': if (ev.id !== myId) toast(`Hráč ${ev.id} (${ROLE_PLAIN[ev.id]}) sa pripojil`); break;
    case 'leave': if (ev.id !== myId) toast(`Hráč ${ev.id} (${ROLE_PLAIN[ev.id]}) sa odpojil`); break;
    case 'pickup': if (ev.by === myId) sfx.pickup(); break;
    case 'loaded': sfx.loaded(); break;
    case 'warehouseComplete': banner('✅ Naložené! Vyrážame…', 1700); sfx.fanfare(); break;
    case 'horn': sfx.horn(); hornRingT = 0.45; hornRingR = ev.range; break;
    case 'crash':
      shake = 0.9; redFlash(); sfx.crash();
      toast(`💥 ${ev.type === 'deer' ? 'Zrážka so zverou' : 'Bandita narazil'}! −${Math.round(ev.dmg * 100)} % nákladu`);
      break;
    case 'shot': if (myRole !== 'gunner') sfx.shotFar(); break;
    case 'arrived': banner(`🏁 V cieli! +💰${ev.pay}`, 2200); sfx.fanfare(); break;
    case 'upgrade': sfx.loaded(); toast(`⬆️ ${UPGRADES.find((u) => u.key === ev.key).name} → level ${ev.level}`); break;
    case 'gameover': sfx.crash(); break;
  }
}

/* ═══════════════════════════════════════════════════════════════
   c. THREE.JS RENDERER + CAMERA
   ═══════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.SKY);
scene.fog = new THREE.Fog(PAL.SKY, 70, 190);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(0, 20, 22);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  aim.x = clamp(aim.x, 0, innerWidth);
  aim.y = clamp(aim.y, 0, innerHeight);
});

/* ═══════════════════════════════════════════════════════════════
   d. HELPER FUNKCIE (mat, box, sphere, cone)
   ═══════════════════════════════════════════════════════════════ */
const matCache = new Map();
const geoCache = new Map();
function mat(color) {
  let m = matCache.get(color);
  if (!m) { m = new THREE.MeshLambertMaterial({ color, flatShading: true }); matCache.set(color, m); }
  return m;
}
function geo(key, make) {
  let g = geoCache.get(key);
  if (!g) { g = make(); geoCache.set(key, g); }
  return g;
}
function place(mesh, x, y, z, parent) {
  mesh.position.set(x, y, z);
  if (parent) parent.add(mesh);
  return mesh;
}
function box(w, h, d, color, x = 0, y = 0, z = 0, parent) {
  return place(new THREE.Mesh(geo(`b${w},${h},${d}`, () => new THREE.BoxGeometry(w, h, d)), mat(color)), x, y, z, parent);
}
function sphere(r, color, x = 0, y = 0, z = 0, parent) {
  return place(new THREE.Mesh(geo(`s${r}`, () => new THREE.SphereGeometry(r, 7, 5)), mat(color)), x, y, z, parent);
}
function cone(r, h, color, x = 0, y = 0, z = 0, parent, seg = 6) {
  return place(new THREE.Mesh(geo(`c${r},${h},${seg}`, () => new THREE.ConeGeometry(r, h, seg)), mat(color)), x, y, z, parent);
}
function cyl(rt, rb, h, color, x = 0, y = 0, z = 0, parent, seg = 8) {
  return place(new THREE.Mesh(geo(`y${rt},${rb},${h},${seg}`, () => new THREE.CylinderGeometry(rt, rb, h, seg)), mat(color)), x, y, z, parent);
}
function wheel(r, w, x, y, z, parent) {
  const g = new THREE.Group();          // obal točí okolo X, valec je otočený na bok
  place(g, x, y, z, parent);
  const c = cyl(r, r, w, PAL.WHEEL, 0, 0, 0, g, 8);
  c.rotation.z = Math.PI / 2;
  box(w + 0.02, r * 0.5, r * 0.5, '#555566', 0, 0, 0, g);   // hub, aby bolo vidieť točenie
  return g;
}
const flashMat = new THREE.MeshLambertMaterial({ color: PAL.HIT_FLASH, emissive: PAL.HIT_FLASH, emissiveIntensity: 0.7, flatShading: true });
function angleLerp(a, b, t) {
  let d = ((b - a + Math.PI) % (Math.PI * 2)) - Math.PI;
  if (d < -Math.PI) d += Math.PI * 2;
  return a + d * t;
}

/* ═══════════════════════════════════════════════════════════════
   e. LIGHTING
   ═══════════════════════════════════════════════════════════════ */
scene.add(new THREE.HemisphereLight(0xffffff, 0x7CB87A, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(25, 40, 15);
scene.add(sun);

/* ═══════════════════════════════════════════════════════════════
   f. WAREHOUSE SCENE BUILDER + RENDERER
   ═══════════════════════════════════════════════════════════════ */
const wh = new THREE.Group();
scene.add(wh);

function shelf(x, z, rot) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);

const playerMeshes = new Map();   // id → { g, tx, tz, walk, arms, legs }
const boxMeshes = new Map();      // id → { m, b }

function makePlayerMesh(color) {

function syncPlayers() {
  for (const id of [1, 2]) {
    const p = S.players[id];
    let o = playerMeshes.get(id);
    if (!o) {
      o = makePlayerMesh(PLAYER_COLORS[id]);
      o.g.position.set(p.x, 0, p.z);
      o.tx = p.x;                     // inak by vlastná postavička začala na (0, 0)
      o.tz = p.z;
      if (id === myId) { localPlayer.x = p.x; localPlayer.z = p.z; }
      playerMeshes.set(id, o);
    }
    // ZMENA: Iba druhého hráča updatujeme podľa servera. Seba si riešime lokálne.
    if (id !== myId) {
      o.tx = p.x;
      o.tz = p.z;
    }
    o.g.visible = p.connected;
  }
}

function syncBoxes() {
  const seen = new Set();
  for (const b of S.boxes) {
    seen.add(b.id);
    let o = boxMeshes.get(b.id);
    if (!o) {
      const m = box(0.8, 0.8, 0.8, PAL.CARGO, b.x, 0.57, b.z, wh);
      box(0.82, 0.12, 0.3, PAL.TRUNK, 0, 0.2, 0, m);      // páska
      o = { m, b };
      boxMeshes.set(b.id, o);
    }
    if (!o.b.loaded && b.loaded) o.m.position.y = 1.6;   // malý "hop" pri naložení
    o.b = b;
  }
  for (const [id, o] of boxMeshes) {
    if (!seen.has(id)) { wh.remove(o.m); boxMeshes.delete(id); }
  }
}

const camTarget = new THREE.Vector3();
function updateWarehouse(dt, now) {
  const k = 1 - Math.exp(-LERP * dt);
  for (const [id, o] of playerMeshes) {
    if (id === myId) {
      // ZMENA: Vypočítame vlastný pohyb úplne hladko podľa frameratu
      const k_key = (c) => keys.has(c);
      let mx = (k_key('KeyD') || k_key('ArrowRight') ? 1 : 0) - (k_key('KeyA') || k_key('ArrowLeft') ? 1 : 0);
      let mz = (k_key('KeyS') || k_key('ArrowDown') ? 1 : 0) - (k_key('KeyW') || k_key('ArrowUp') ? 1 : 0);
      const len = Math.hypot(mx, mz);
      if (len > 1) { mx /= len; mz /= len; }
      
      o.tx = clamp(o.tx + mx * 7 * dt, -10.8, 10.8);
      o.tz = clamp(o.tz + mz * 7 * dt, -7.4, 9.2);
      localPlayer.x = o.tx;
      localPlayer.z = o.tz;
    }
      const dx = o.tx - o.g.position.x;
      const dz = o.tz - o.g.position.z;
      if (Math.hypot(dx, dz) > 6) {
        o.g.position.set(o.tx, 0, o.tz);
      } else { 
        const smoothK = (id === myId) ? k : (1 - Math.exp(-6 * dt)); 
        o.g.position.x += dx * smoothK; 
        o.g.position.z += dz * smoothK; 
      }
    const moving = Math.hypot(dx, dz) > 0.03;
    if (moving) {
      o.g.rotation.y = angleLerp(o.g.rotation.y, Math.atan2(-dx, -dz), 1 - Math.exp(-12 * dt));
      o.walk += dt * 13;
    }
    const sw = moving ? Math.sin(o.walk) : 0;
    o.g.position.y = moving ? Math.abs(Math.sin(o.walk)) * 0.1 : 0;
    o.legs[0].rotation.x = sw * 0.6;
    o.legs[1].rotation.x = -sw * 0.6;
    const carrying = S.boxes.some((b) => b.carriedBy === id);
    o.arms[0].rotation.x = carrying ? -1.4 : -sw * 0.5;
    o.arms[1].rotation.x = carrying ? -1.4 : sw * 0.5;
  }

  for (const o of boxMeshes.values()) {
    const b = o.b;
    if (b.carriedBy && playerMeshes.has(b.carriedBy)) {
      const h = playerMeshes.get(b.carriedBy).g;
      const ry = h.rotation.y;
      o.m.position.set(h.position.x - Math.sin(ry) * 0.6, 1.45 + h.position.y, h.position.z - Math.cos(ry) * 0.6);
      o.m.rotation.y = ry;
    } else if (b.loaded) {
      o.m.position.x += (b.x - o.m.position.x) * k;
      o.m.position.z += (b.z - o.m.position.z) * k;
      o.m.position.y += (1.2 - o.m.position.y) * k;
      o.m.rotation.y = 0;
    } else {
      o.m.position.set(b.x, 0.57, b.z);
      o.m.rotation.y = 0;
    }
  }

  // zdieľaná kamera sleduje priemer pozícií oboch hráčov
  let ax = 0, az = 0, n = 0;
  for (const [id, o] of playerMeshes) {
    if (!S.players[id].connected) continue;
    ax += o.g.position.x; az += o.g.position.z; n++;
  }
  if (n) { ax /= n; az /= n; }
  camTarget.set(ax * 0.5, 0, az * 0.45 + 1);
  const ck = 1 - Math.exp(-4 * dt);
  camera.position.x += (camTarget.x - camera.position.x) * ck;
  camera.position.y += (19 - camera.position.y) * ck;
  camera.position.z += (camTarget.z + 14 - camera.position.z) * ck;
  camera.lookAt(camera.position.x, 0, camera.position.z - 14);
  applyShake(dt);
}

function makeThreat(type) {

  if (type === 'deer') {
    box(1.5, 0.7, 0.6, PAL.ANIMAL, 0, 1.2, 0, g);

    cone(0.07, 0.6, PAL.SHELF, 0.9, 2.4, -0.13, g, 4).rotation.z = 0.3;
    cone(0.07, 0.6, PAL.SHELF, 0.9, 2.4, 0.13, g, 4).rotation.z = 0.3;
    box(0.2, 0.25, 0.2, PAL.STRIPE, -0.8, 1.35, 0, g);
  } else {
    box(1.9, 0.8, 3.4, PAL.THREAT, 0, 0.75, 0, g);
    box(1.6, 0.6, 1.7, '#CC4422', 0, 1.45, 0.2, g);
    box(1.4, 0.45, 0.06, PAL.UI_BG, 0, 1.45, -0.66, g);
    box(0.4, 0.2, 0.08, PAL.GOLD, -0.6, 0.85, -1.72, g);
    box(0.4, 0.2, 0.08, PAL.GOLD, 0.6, 0.85, -1.72, g);
    box(1.9, 0.2, 0.2, PAL.WHEEL, 0, 1.0, -1.71, g);
    for (const z of [-1.1, 1.1]) for (const x of [-0.95, 0.95]) wheel(0.42, 0.3, x, 0.42, z, g);
  }
  const stun = new THREE.Group();
  stun.position.y = type === 'deer' ? 3.0 : 2.5;
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * Math.PI * 2;
    const st = new THREE.Mesh(geo('oct', () => new THREE.OctahedronGeometry(0.2)), mat(PAL.GOLD));
    st.position.set(Math.cos(a) * 0.6, 0, Math.sin(a) * 0.6);
    stun.add(st);
  }
  stun.visible = false;
  g.add(stun);
  o.stun = stun;

}

function syncThreats() {
  const seen = new Set();
  for (const t of S.threats) {
    seen.add(t.id);
    let o = threatMeshes.get(t.id);
    if (!o) {
      o = makeThreat(t.type);
      o.g.position.set(t.x, 0, t.z);
      o.dying = 0;
      threatMeshes.set(t.id, o);
    }
    o.tx = t.x; o.tz = t.z; o.dir = t.dir; o.stunned = t.stunned;
  }
  for (const [id, o] of threatMeshes) {
    if (!seen.has(id) && !o.dying) { drive.remove(o.g); threatMeshes.delete(id); }
  }
}
function clearThreats() {
  for (const o of threatMeshes.values()) drive.remove(o.g);
  threatMeshes.clear();
}

  o.g.traverse((c) => { if (c.isMesh) c.material = flashMat; });
}

const disp = { dist: 0, truckX: 0 };
function updateDriving(dt, now) {
  const live = S.phase === 'driving' && !S.paused;
  
  // ZMENA: Plynulý lokálny posun kamiónu
  if (myRole === 'driver' && live) {
    const k_key = (c) => keys.has(c);
    const steer = (k_key('KeyD') || k_key('ArrowRight') ? 1 : 0) - (k_key('KeyA') || k_key('ArrowLeft') ? 1 : 0);
    localTruckX = clamp(localTruckX + steer * 6 * dt, -2.5, 2.5);
  } else if (S) {
    localTruckX = S.truckX;
  }
  
  // vzdialenosť: posledný tick + extrapolácia rýchlosťou
  let target = S.dist + (live ? S.speed * Math.min((now - lastTickAt) / 1000, 0.12) : 0);
  target = Math.min(target, TRIP_DIST);
  if (Math.abs(target - disp.dist) > 15) disp.dist = target;
  else disp.dist += (target - disp.dist) * (1 - Math.exp(-25 * dt));
  const tz = -disp.dist;

  // Pre výpočet použijeme lokálny localTruckX namiesto serverového S.truckX
  const steerDiff = localTruckX - disp.truckX;
  disp.truckX += steerDiff * (1 - Math.exp(-LERP * dt));
  truck.g.position.set(disp.truckX, live ? Math.abs(Math.sin(now * 0.018)) * 0.04 : 0, tz);
  truck.g.rotation.y = -steerDiff * 0.3;
  if (live) for (const w of truck.wheels) w.rotation.x -= (S.speed * dt) / 0.55;

  const base = Math.floor(tz / ROAD_TILE) * ROAD_TILE;
  roadTiles.forEach((g, i) => { g.position.z = base + (3 - i) * ROAD_TILE; });
  groundD.position.z = tz;
  for (const t of trees) recycle(t, tz, 7, 45);
  for (const h of houses) recycle(h, tz, 16, 50);

  const k = 1 - Math.exp(-12 * dt);
  for (const [id, o] of threatMeshes) {
    if (o.dying > 0) {
      o.dying -= dt;
      o.g.scale.setScalar(1 + (0.2 - Math.max(0, o.dying)) * 2.5);
      if (o.dying <= 0) { drive.remove(o.g); threatMeshes.delete(id); }
      continue;
    }
    if (Math.abs(o.tz - o.g.position.z) > 10) o.g.position.set(o.tx, 0, o.tz);
    o.g.position.x += (o.tx - o.g.position.x) * k;
    o.g.position.z += (o.tz - o.g.position.z) * k;
    o.stun.visible = o.stunned;
    if (o.stunned) o.stun.rotation.y += dt * 5;
    if (o.type === 'deer') {
      o.g.rotation.y = o.dir > 0 ? 0 : Math.PI;
      const run = o.stunned ? 0 : Math.sin(now * 0.02 + id);
      o.g.position.y = o.stunned ? 0 : Math.abs(run) * 0.22;
      o.legs.forEach((l, i) => { l.rotation.z = (i % 2 ? 1 : -1) * run * 0.5; });
    } else {
      o.g.rotation.y = o.stunned ? Math.sin(now * 0.03) * 0.15 : (o.tx - o.g.position.x) * -0.2;
      o.g.position.y = o.stunned ? 0 : Math.abs(Math.sin(now * 0.025 + id)) * 0.05;
    }
  }

  if (hornRingT > 0) {
    hornRingT -= dt;
    const p = 1 - Math.max(0, hornRingT) / 0.45;
    hornRing.visible = true;
    hornRing.position.set(disp.truckX, 0.3, tz);
    hornRing.scale.setScalar(Math.max(0.01, p * hornRingR));
    hornRing.material.opacity = 0.8 * (1 - p);
  } else hornRing.visible = false;

  if (myRole === 'gunner') {
    camera.position.set(disp.truckX, GUN_CAM.y, tz + GUN_CAM.back);
    camera.lookAt(disp.truckX, GUN_CAM.lookY, tz - GUN_CAM.lookAhead);
  } else {
    const cx = disp.truckX * 0.6;
    camera.position.set(cx, DRIVER_CAM.y, tz + DRIVER_CAM.back);
    camera.lookAt(cx, DRIVER_CAM.lookY, tz - DRIVER_CAM.lookAhead);
  }
  applyShake(dt);
}

let shake = 0;
function applyShake(dt) {
  if (shake <= 0) return;
  camera.position.x += (Math.random() - 0.5) * shake;
  camera.position.y += (Math.random() - 0.5) * shake;
  shake = Math.max(0, shake - dt * 2.2);
}

/* ═══════════════════════════════════════════════════════════════
   h. GUNNER OVERLAY (crosshair, shot trail, cooldown bar)
   ═══════════════════════════════════════════════════════════════ */
const SVG_NS = 'http://www.w3.org/2000/svg';
const aim = { x: innerWidth / 2, y: innerHeight / 2 };
let localShotAt = -1e9;

const isLocked = () => document.pointerLockElement === renderer.domElement;
const gunCdMax = () => (S ? S.gunCdMax : 0.4);
const gunnerActive = () => S && myRole === 'gunner' && S.phase === 'driving' && !S.paused && mode === 'drive';

function shoot() {
  const now = performance.now();
  if ((now - localShotAt) / 1000 < gunCdMax() + 0.01) return;  // server kontroluje cooldown tiež
  localShotAt = now;
  const aimX = (aim.x / innerWidth) * 2 - 1;          // -1..1 zľava doprava
  const aimY = -((aim.y / innerHeight) * 2 - 1);      // -1..1 zdola nahor (ako NDC v Three.js)
  send({ type: 'input', role: 'gunner', shoot: true, aimX, aimY, aspect: innerWidth / innerHeight });
  drawTrail(aim.x, aim.y);
  sfx.shot();
}

function drawTrail(x, y) {
  const svg = $('trails');
  const l = document.createElementNS(SVG_NS, 'line');
  l.setAttribute('x1', innerWidth / 2);
  l.setAttribute('y1', innerHeight / 2);
  l.setAttribute('x2', x);
  l.setAttribute('y2', y);
  l.setAttribute('stroke', PAL.SHOT_TRAIL);
  l.setAttribute('stroke-width', '3');
  l.setAttribute('stroke-linecap', 'round');
  svg.appendChild(l);
  requestAnimationFrame(() => requestAnimationFrame(() => { l.style.opacity = '0'; }));
  setTimeout(() => l.remove(), 260);
}

function updateGunnerOverlay() {
  const ch = $('crosshair');
  if (!gunnerActive()) { ch.style.display = 'none'; return; }
  ch.style.display = 'block';
  ch.style.transform = `translate(${aim.x}px, ${aim.y}px)`;
  const frac = clamp((performance.now() - localShotAt) / 1000 / gunCdMax(), 0, 1);
  const fill = $('cdfill');
  fill.style.width = `${frac * 100}%`;
  fill.style.background = frac >= 1 ? '#FFFFFF' : PAL.GOLD;
}

function countThreatsOnScreen() {
  const v = new THREE.Vector3();
  let n = 0;
  for (const o of threatMeshes.values()) {
    if (o.dying) continue;
    v.set(o.g.position.x, 1, o.g.position.z).project(camera);
    if (v.z < 1 && Math.abs(v.x) <= 1 && Math.abs(v.y) <= 1) n++;
  }
  return n;
}

function bar(frac, color) {

function tag(text, color) { return `<span class="tag" style="background:${color}">${text}</span>`; }

let hudTimer = 0;

let bannerTimer = 0;

function redFlash() {

let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, dur, type = 'square', vol = 0.06, slideTo = 0, delay = 0) {
  const a = actx;
  if (!a || a.state !== 'running') return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator();
  const g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}
const sfx = {
  shot: () => tone(900, 0.09, 'square', 0.05, 180),
  shotFar: () => tone(700, 0.07, 'square', 0.025, 200),
  hit: () => tone(320, 0.16, 'sawtooth', 0.07, 70),
  horn: () => { tone(220, 0.4, 'sawtooth', 0.06); tone(277, 0.4, 'sawtooth', 0.05); },
  crash: () => tone(140, 0.35, 'sawtooth', 0.1, 40),
  pickup: () => tone(600, 0.07, 'triangle', 0.07, 900),
  loaded: () => tone(800, 0.1, 'triangle', 0.07, 1300),
  fanfare: () => { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'triangle', 0.07, 0, i * 0.1)); },
};

/* ═══════════════════════════════════════════════════════════════
   l. INPUT CAPTURE (keys + mouse, Pointer Lock)
   ═══════════════════════════════════════════════════════════════ */
const keys = new Set();
const GAME_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  audio();
  if (e.code === 'Escape') {
    // Esc počas zamknutej myši ju len uvoľní (prehliadač); inak zavrie okno / prepne menu
    if ($('ovInfo').classList.contains('show')) $('ovInfo').classList.remove('show');
    else if (!isLocked()) toggleGameMenu();
    return;
  }
  if ($('ovMenu').classList.contains('show')) return;   // v menu sa nejazdí
  keys.add(e.code);
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
});
addEventListener('keyup', (e) => { keys.delete(e.code); });
addEventListener('blur', () => keys.clear());

let lastSendTime = 0;
function pollInput() {
  if (!myId || !ws || ws.readyState !== WebSocket.OPEN) return;
  
  // Pevný limit siete: Odosielame dáta max 10-krát za sekundu (každých 100 ms)
  const now = performance.now();
  if (now - lastSendTime < 100) return;
  lastSendTime = now;

  const k_key = (c) => keys.has(c);
  const msg = { type: 'input', role: myRole };
  
  if (S && S.phase === 'warehouse') {
    // Zaokrúhlenie na 2 desatinné miesta šetrí veľkosť paketu
    msg.pos = { x: Math.round(localPlayer.x * 100) / 100, z: Math.round(localPlayer.z * 100) / 100 };
  }
  if (myRole === 'driver') {
    msg.keys = { horn: k_key('Space') };
    if (S && S.phase === 'driving') {
      msg.truckX = Math.round(localTruckX * 100) / 100;
    }
  }
  
  const s = JSON.stringify(msg);
  // Odošle sa len vtedy, ak sa hráč skutočne hýbe alebo niečo stlačil
  if (s !== lastSentInput) { 
    ws.send(s); 
    lastSentInput = s; 
  }
}

document.addEventListener('mousemove', (e) => {
  if (isLocked()) {
    aim.x = clamp(aim.x + e.movementX * AIM_SENS, 0, innerWidth);
    aim.y = clamp(aim.y + e.movementY * AIM_SENS, 0, innerHeight);
  } else {
    aim.x = e.clientX;
    aim.y = e.clientY;
  }
});

    if (p && p.catch) p.catch(() => {});
  }
  shoot();
});

/* ═══════════════════════════════════════════════════════════════
   m. RAF LOOP
   ═══════════════════════════════════════════════════════════════ */
let lastFrame = performance.now();
let loopErrorShown = false;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastFrame) / 1000, 0.05);
  lastFrame = now;
  if (S) {
    // chyba v jednom snímku nesmie zastaviť celú hru (input, HUD a render bežia ďalej)
    try {
      if (mode === 'warehouse') updateWarehouse(dt, now);
      else updateDriving(dt, now);
    } catch (e) {
      if (!loopErrorShown) { loopErrorShown = true; console.error('[frame]', e); toast('⚠️ Chyba v hre — pozri konzolu (F12)'); }
    }
  } else {
    // pred pripojením: kamera pomaly krúži nad skladom
    const a = now * 0.00012;
    camera.position.set(Math.sin(a) * 24, 16, Math.cos(a) * 24);
    camera.lookAt(0, 0, 2);
  }
  pollInput();
  updateGunnerOverlay();
  updateHUD(dt);
  renderer.render(scene, camera);
}

let savedHost = '';
try { savedHost = localStorage.getItem('fst-host') || ''; } catch { /* ignore */ }
$('ipInput').value = qsHost || savedHost || HOST_IP;
if (qsHost) { showView('play'); connect(qsHost); }
requestAnimationFrame(loop);
</script>
</body>
</html>
